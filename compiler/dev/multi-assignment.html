<title>Multi Assignment</title>

<script compiled>
  $message = "World!";
</script>

<p data-testid="text-out">Current message: {{ $message }}</p>
<input data-testid="value-out1" *value="$message" />
<input data-testid="value-out2" *value="$message" />
<input data-testid="placeholder-out" *placeholder="$message" />

<div>
  <button
    data-testid="world-btn"
    @click="$message = 'World'"
  >
    World
  </button>

  <button
    data-testid="me-btn"
    @click="$message = 'Me'"
  >
    Me
  </button>

  <button
    data-testid="everyone-btn"
    @click="$message = 'Everyone!'"
  >
    Everyone!
  </button>
</div>

<p>
  When updating reactive variable, you should see that the both outlets are
  updated.
</p>
