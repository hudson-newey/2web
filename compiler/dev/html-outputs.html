<title>HTML Outputs</title>

<script compiled>
  import { greet } from "./api/greetings.server.ts";

  $htmlContent = "<strong>from a variable</strong>";
  $count = 0;
</script>

<div class="html-var">[[ $htmlContent ]]</div>
<div class="html-call">[[ greet("server") ]]</div>
<p class="text-var">{{ $htmlContent }}</p>

<button @click="$htmlContent = '<em>updated html</em>'">Update</button>
<button @click="$count++">Count</button>
