<title>Reactive Variables</title>

<script compiled>
  $mouseX = 0;
  $mouseY = 0;
</script>

<p>x: {{ $mouseX }}</p>
<p>y: {{ $mouseY }}</p>

<div
  class="canvas"
  @mousemove="$mouseY = event.offsetY"
  @mousemove="$mouseX = event.offsetX"
></div>

<style>
  .canvas {
    position: relative;
    width: 100%;
    height: 80dvh;

    background-color: rgb(20, 80, 10);
  }
</style>
